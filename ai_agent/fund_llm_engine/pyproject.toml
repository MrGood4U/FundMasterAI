[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-llm-engine"
version = "0.1.0"
description = "Standalone LLM module for fund analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.12.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

