server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index portfolio-overview.html index.html;
    client_max_body_size 2m;

    # Docker may assign a new IP when a backend container restarts or is
    # recreated. Resolve service names through Docker DNS at request time so
    # Nginx does not keep proxying to a stale container address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $market_backend market:5001;
    set $news_backend news:5000;
    set $portfolio_backend portfolio:5002;
    set $agent_backend agent:5003;

    location /api/market/ {
        proxy_pass http://$market_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/news/ {
        proxy_pass http://$news_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/portfolio/ {
        proxy_pass http://$portfolio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ai/ {
        proxy_pass http://$agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Demo builds reuse stable asset filenames. Force browsers to revalidate
        # them so a refreshed HTML page cannot mix new JavaScript with old CSS.
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /portfolio-overview.html;
    }
}
