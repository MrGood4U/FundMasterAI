<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <rect width="920" height="520" fill="#f7f8fa"/>
  <text x="460" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Figure 2. FundMasterAI System Architecture</text>

  <rect x="40" y="70" width="160" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="120" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Frontend</text>
  <text x="120" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">frontend_new / Nginx</text>

  <rect x="260" y="70" width="180" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="350" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">AI Agent Service</text>
  <text x="350" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">fund_llm_engine :5003</text>

  <rect x="500" y="70" width="170" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="585" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Market Backend</text>
  <text x="585" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Flask API :5001</text>

  <rect x="720" y="70" width="160" height="70" rx="10" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="800" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">News Backend</text>
  <text x="800" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Flask API :5010</text>

  <path d="M200 105 H260" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 95 H500" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 115 H500" stroke="#222" stroke-width="1.5" opacity="0"/>
  <path d="M350 140 V180 H800 V140" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="210" width="840" height="250" rx="12" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="60" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">AI Analysis Pipeline (deterministic orchestration)</text>

  <rect x="70" y="270" width="130" height="58" rx="8" fill="#eef3ff" stroke="#334"/>
  <text x="135" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Adapter</text>
  <text x="135" y="313" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10">backend functions</text>

  <rect x="230" y="270" width="130" height="58" rx="8" fill="#eef3ff" stroke="#334"/>
  <text x="295" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">FeatureBuilder</text>
  <text x="295" y="313" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10">quant metrics</text>

  <rect x="390" y="270" width="300" height="58" rx="8" fill="#eef8ef" stroke="#334"/>
  <text x="540" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Specialist Agents (parallel)</text>
  <text x="540" y="313" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10">Perf / Risk / Exposure / Sector / Sentiment / Market / Bond</text>

  <rect x="720" y="270" width="130" height="58" rx="8" fill="#fff4e8" stroke="#334"/>
  <text x="785" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">ChiefAgent</text>
  <text x="785" y="313" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10">aggregate + explain</text>

  <path d="M200 299 H230" stroke="#222" stroke-width="1.5"/>
  <path d="M360 299 H390" stroke="#222" stroke-width="1.5"/>
  <path d="M690 299 H720" stroke="#222" stroke-width="1.5"/>

  <text x="70" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12">Contracts: FundAnalysisInput ’ FundFeaturePack ’ AgentOutput[] ’ FinalAnalysisResult</text>
  <text x="70" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12">Scoring: deterministic heuristics; LLM: narrative explanation (mock or real model)</text>
  <text x="70" y="430" font-family="Helvetica, Arial, sans-serif" font-size="12">Reliability: safe_analyze isolation, rating quorum, insufficient_data abstention</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>
</svg>
