<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" fill="#f7f8fa"/>
  <text x="460" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Figure 3. Multi-Agent Analysis Workflow</text>

  <rect x="30" y="70" width="140" height="54" rx="8" fill="#fff" stroke="#222"/>
  <text x="100" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">HTTP Request</text>

  <rect x="200" y="70" width="150" height="54" rx="8" fill="#fff" stroke="#222"/>
  <text x="275" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Build Input</text>

  <rect x="380" y="70" width="150" height="54" rx="8" fill="#eef3ff" stroke="#222"/>
  <text x="455" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">FeatureBuilder</text>

  <rect x="560" y="70" width="150" height="54" rx="8" fill="#eef8ef" stroke="#222"/>
  <text x="635" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Fund Routing</text>

  <rect x="740" y="70" width="150" height="54" rx="8" fill="#fff4e8" stroke="#222"/>
  <text x="815" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Run Agents</text>

  <path d="M170 97 H200" stroke="#222"/>
  <path d="M350 97 H380" stroke="#222"/>
  <path d="M530 97 H560" stroke="#222"/>
  <path d="M710 97 H740" stroke="#222"/>

  <rect x="60" y="180" width="110" height="44" rx="6" fill="#fff" stroke="#444"/>
  <text x="115" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Performance</text>
  <rect x="190" y="180" width="110" height="44" rx="6" fill="#fff" stroke="#444"/>
  <text x="245" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Risk</text>
  <rect x="320" y="180" width="110" height="44" rx="6" fill="#fff" stroke="#444"/>
  <text x="375" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Exposure</text>
  <rect x="450" y="180" width="110" height="44" rx="6" fill="#fff" stroke="#444"/>
  <text x="505" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Sector</text>
  <rect x="580" y="180" width="110" height="44" rx="6" fill="#fff" stroke="#444"/>
  <text x="635" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Sentiment</text>
  <rect x="710" y="180" width="110" height="44" rx="6" fill="#fff" stroke="#444"/>
  <text x="765" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11">Market/Bond</text>

  <text x="460" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12">Each agent returns AgentOutput {status, score, stance, confidence, narrative, key_points}</text>

  <rect x="260" y="290" width="180" height="54" rx="8" fill="#fff4e8" stroke="#222"/>
  <text x="350" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Chief Aggregation</text>

  <rect x="500" y="290" width="180" height="54" rx="8" fill="#fff" stroke="#222"/>
  <text x="590" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Final Rating</text>

  <path d="M350 234 V290" stroke="#222"/>
  <path d="M440 317 H500" stroke="#222"/>

  <text x="460" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12">Rating bands: BUY e75 / HOLD e60 / WATCH e45 / AVOID &lt;45 (heuristic)</text>
</svg>
