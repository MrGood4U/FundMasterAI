<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FundMaster — Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/dashboard-widgets.css" />
    <link rel="stylesheet" href="css/page-settings.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="主导航">
        <div class="sidebar__brand">
          <img class="sidebar__logo" src="assets/icons/logo.png" width="32" height="32" alt="" />
          <div class="sidebar__titles">
            <h1 class="sidebar__name">FundMaster</h1>
            <p class="sidebar__tagline">STRATEGIC CAPITAL</p>
          </div>
        </div>
        <nav class="sidebar__nav" aria-label="功能菜单">
          <a class="nav-link" href="global-investment.html">
            <img class="nav-link__icon" src="assets/icons/nav-overview.png" width="20" height="20" alt="" />
            Overview
          </a>
          <a class="nav-link" href="portfolio-overview.html">
            <img class="nav-link__icon" src="assets/icons/nav-portfolio.png" width="20" height="20" alt="" />
            Portfolio
          </a>
          <a class="nav-link" href="fund-deep-dive.html">
            <img class="nav-link__icon" src="assets/icons/nav-analytics.png" width="20" height="20" alt="" />
            Analytics
          </a>
          <a class="nav-link" href="market-hub.html">
            <img class="nav-link__icon" src="assets/icons/nav-markets.png" width="20" height="20" alt="" />
            Markets
          </a>
          <a class="nav-link" href="index.html">
            <img class="nav-link__icon" src="assets/icons/nav-news.png" width="20" height="20" alt="" />
            News
          </a>
          <a class="nav-link" href="ai-insights.html">
            <img class="nav-link__icon" src="assets/icons/nav-ai-insights.png" width="20" height="20" alt="" />
            AI Insights
          </a>
          <a class="nav-link nav-link--active" href="settings.html" aria-current="page">
            <img class="nav-link__icon" src="assets/icons/nav-settings.png" width="20" height="20" alt="" />
            Settings
          </a>
        </nav>
        <div class="sidebar__footer">
          <button type="button" class="btn-upgrade">
            <span class="btn-upgrade__icon" aria-hidden="true">◇</span>
            Upgrade to Pro
          </button>
        </div>
      </aside>
      <div class="main-shell">
      <header class="top-bar">
        <div class="search-field" role="search">
          <img class="search-field__icon-img" src="assets/icons/header-search.png" width="16" height="16" alt="" />
          <label class="visually-hidden" for="st-q">搜索</label>
          <input id="st-q" class="search-field__input" type="search" placeholder="Search funds..." autocomplete="off" />
        </div>
        <div class="top-bar__actions">
          <button type="button" class="icon-btn" aria-label="通知"><img class="icon-btn__img" src="assets/icons/header-bell.png" width="18" height="18" alt="" /></button>
          <button type="button" class="icon-btn" aria-label="帮助"><img class="icon-btn__img" src="assets/icons/header-help.png" width="18" height="18" alt="" /></button>
          <button type="button" class="avatar-btn" aria-label="用户资料"><img class="avatar-btn__img" src="assets/icons/header-avatar.png" width="32" height="32" alt="" /></button>
        </div>
      </header>
        <main class="content">
          <header class="page-head">
            <div>
              <h2 class="page-head__title">Settings</h2>
              <p class="page-head__sub">Account preferences and security — Figma 14:3184.</p>
            </div>
          </header>
          <div class="two-col">
            <section class="glass-panel">
              <h3 class="section-head__title section-head__title--compact">Profile</h3>
              <label class="st-label">Display name<input class="st-input" type="text" value="Alex Chen" /></label>
              <label class="st-label">Work email<input class="st-input" type="email" value="alex@fundmaster.io" /></label>
              <label class="st-label">Timezone<select class="st-input"><option>Asia/Shanghai</option><option>America/New_York</option></select></label>
            </section>
            <section class="glass-panel">
              <h3 class="section-head__title section-head__title--compact">Notifications</h3>
              <label class="st-row"><input type="checkbox" checked /> Macro calendar alerts</label>
              <label class="st-row"><input type="checkbox" checked /> AI rebalancing suggestions</label>
              <label class="st-row"><input type="checkbox" /> Marketing &amp; product updates</label>
            </section>
          </div>
          <section class="glass-panel">
            <h3 class="section-head__title section-head__title--compact">Security</h3>
            <p class="muted">Two-factor authentication recommended for trading-enabled accounts.</p>
            <div class="toolbar"><button type="button" class="btn-outline">Enable 2FA</button><button type="button" class="btn-outline">Rotate API keys</button></div>
          </section>
        </main>

      </div>
    </div>
  </body>
</html>
